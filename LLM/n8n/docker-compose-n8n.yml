  #             capabilities: [gpu]
  #   command: >
  #     sleep infinity;
  #     python3 -m llama_cpp.server --model /models/EXAONE-3.5-7.8B-Instruct-q4_k_m/EXAONE-3.5-7.8B-Instruct-q4_k_m.gguf --n_gpu_layers 32 --host 0.0.0.0 --port 8000


  fastapi-server:
    networks: 
      - llm_default
      - demo 
    container_name: fastapi-server
    restart: unless-stopped
    environment:
      - DEBUG_MODE=${DEBUG_MODE}
    build:
      context: ./fastapi-server
      dockerfile: Dockerfile.fastapi-server
    ports:
      - "9999:9999"
    volumes:
      - ./fastapi-server:/fastapi-server
    entrypoint: ["/bin/sh", "/fastapi-server/entrypoint.sh"]

  postgres:
    image: postgres:16-alpine
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    <<: *service-n8n
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ./n8n/backup:/backup
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *service-n8n
    container_name: n8n
    restart: unless-stopped
    user: root  # 이 줄 추가

    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      # - ./n8n_custom_node:/home/node/.n8n/custom/ #추가
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      - GENERIC_TIMEZONE=Asia/Seoul
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - NODE_ENV=production
      - NODE_PATH=/home/node/.n8n/custom/n8n-nodes-starter/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu


  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama/models  # ✅ 여기에 너의 gguf 모델 넣으면 됨
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=300m
      - OLLAMA_GPU_OVERHEAD=0
      - OLLAMA_KV_CACHE_TYPE=ram
      - OLLAMA_LOAD_TIMEOUT=300m
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8012:8000"  # REST API 기본 포트
    volumes:
      - ./chroma_data:/chroma/chroma  # 데이터를 지속적으로 보존하기 위한 볼륨
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped



